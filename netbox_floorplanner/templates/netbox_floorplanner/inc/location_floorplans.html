{% load static %}
{% load i18n %}
<link rel="stylesheet" href="{% static 'netbox_floorplanner/floorplanner.css' %}?v=0.1.3">
<div class="card">
  <h2 class="card-header">{% trans "Floor Plans" %}</h2>
  <div class="card-body fp-preview-list">
    {% for plan, svg in previews %}
      <a href="{{ plan.get_absolute_url }}" class="fp-preview-card" title="{% trans 'Open floor plan' %}">
        {{ svg }}
        <span class="fp-preview-name"><i class="mdi mdi-floor-plan"></i> {{ plan.name }}</span>
      </a>
    {% endfor %}
  </div>
</div>
